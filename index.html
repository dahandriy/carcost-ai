<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563EB">
<meta name="description" content="CarCost AI: учёт расходов на автомобиль, стоимость 1 км, прогноз и ИИ-ассистент.">
<title>CarCost AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#F3F5F9; --surface:#FFFFFF; --surface2:#F7F8FB; --ink:#0E1726; --muted:#5A6478; --dim:#8A93A6; --line:#E3E7EF;
  --accent:#2563EB; --accent2:#1D4FD8; --accentInk:#FFFFFF; --accentSoft:#E9F0FF;
  --good:#0F8A4A; --goodSoft:#E3F6EC; --bad:#D8343C; --badSoft:#FDECEC; --warn:#B7791F; --warnSoft:#FDF4E3;
  --grid:#EDF0F5; --shadow:0 1px 2px rgba(14,23,38,.04),0 6px 24px rgba(14,23,38,.06); --shadowLg:0 24px 60px rgba(14,23,38,.18);
  --font:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0A0F1C; --surface:#111827; --surface2:#162033; --ink:#E7ECF5; --muted:#98A3B8; --dim:#6D7890; --line:#223049;
    --accent:#5B8DFF; --accent2:#7AA3FF; --accentInk:#07122B; --accentSoft:rgba(91,141,255,.14);
    --good:#3CCB85; --goodSoft:rgba(60,203,133,.13); --bad:#FF6B72; --badSoft:rgba(255,107,114,.13); --warn:#F2B34C; --warnSoft:rgba(242,179,76,.13);
    --grid:#1C2740; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); --shadowLg:0 24px 60px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0A0F1C; --surface:#111827; --surface2:#162033; --ink:#E7ECF5; --muted:#98A3B8; --dim:#6D7890; --line:#223049;
  --accent:#5B8DFF; --accent2:#7AA3FF; --accentInk:#07122B; --accentSoft:rgba(91,141,255,.14);
  --good:#3CCB85; --goodSoft:rgba(60,203,133,.13); --bad:#FF6B72; --badSoft:rgba(255,107,114,.13); --warn:#F2B34C; --warnSoft:rgba(242,179,76,.13);
  --grid:#1C2740; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); --shadowLg:0 24px 60px rgba(0,0,0,.5);
}
/* app-level theme switch (settings) wins over system */
body.t-light{
  color-scheme:light;
  --bg:#F3F5F9; --surface:#FFFFFF; --surface2:#F7F8FB; --ink:#0E1726; --muted:#5A6478; --dim:#8A93A6; --line:#E3E7EF;
  --accent:#2563EB; --accent2:#1D4FD8; --accentInk:#FFFFFF; --accentSoft:#E9F0FF;
  --good:#0F8A4A; --goodSoft:#E3F6EC; --bad:#D8343C; --badSoft:#FDECEC; --warn:#B7791F; --warnSoft:#FDF4E3;
  --grid:#EDF0F5; --shadow:0 1px 2px rgba(14,23,38,.04),0 6px 24px rgba(14,23,38,.06); --shadowLg:0 24px 60px rgba(14,23,38,.18);
}
body.t-dark{
  color-scheme:dark;
  --bg:#0A0F1C; --surface:#111827; --surface2:#162033; --ink:#E7ECF5; --muted:#98A3B8; --dim:#6D7890; --line:#223049;
  --accent:#5B8DFF; --accent2:#7AA3FF; --accentInk:#07122B; --accentSoft:rgba(91,141,255,.14);
  --good:#3CCB85; --goodSoft:rgba(60,203,133,.13); --bad:#FF6B72; --badSoft:rgba(255,107,114,.13); --warn:#F2B34C; --warnSoft:rgba(242,179,76,.13);
  --grid:#1C2740; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); --shadowLg:0 24px 60px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent);text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* buttons & inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s,box-shadow .15s,transform .1s}
.btn:hover{border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accentInk)}
.btn.primary:hover{background:var(--accent2);border-color:var(--accent2)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface2)}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}
.btn.lg{padding:14px 22px;font-size:16px;border-radius:14px}
.btn.icon{width:38px;height:38px;padding:0}
.btn.danger{color:var(--bad)}
.btn.danger:hover{border-color:var(--bad);background:var(--badSoft)}
.btn.block{width:100%}
.field{display:grid;gap:6px}
.field>span{font-size:13px;font-weight:600;color:var(--muted)}
.inp{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:15px;transition:border-color .15s,box-shadow .15s}
.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accentSoft)}
.inp.err{border-color:var(--bad)}
.ferr{font-size:12.5px;color:var(--bad);min-height:0}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
textarea.inp{resize:vertical}
input[type=range]{width:100%;accent-color:var(--accent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:560px){.grid2,.grid3{grid-template-columns:1fr}}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.chip.accent{background:var(--accentSoft);color:var(--accent);border-color:transparent}
.chip.good{background:var(--goodSoft);color:var(--good);border-color:transparent}
.chip.bad{background:var(--badSoft);color:var(--bad);border-color:transparent}
.chip.warn{background:var(--warnSoft);color:var(--warn);border-color:transparent}
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* public pages */
.pub{padding-inline:16px}
.pub .wrap{max-width:1120px;margin:0 auto}
.pnav{display:flex;align-items:center;gap:12px;height:68px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:-.02em;color:var(--ink);cursor:pointer;background:none;border:0;padding:0}
.brand .lg{width:32px;height:32px;border-radius:10px;background:var(--accent);color:var(--accentInk);display:grid;place-items:center}
.brand .lg svg{width:18px;height:18px}
.brand small{font-size:11px;font-weight:700;color:var(--accent);background:var(--accentSoft);padding:2px 6px;border-radius:6px;letter-spacing:.02em}
.pnav .sp{flex:1}
.hero{display:grid;gap:40px;align-items:center;padding-block:48px 56px}
@media (min-width:980px){.hero{grid-template-columns:1fr 1.05fr}}
.hero h1{font-size:clamp(34px,5vw,56px);line-height:1.05;letter-spacing:-.035em;margin:14px 0 16px;font-weight:800;text-wrap:balance}
.hero h1 span{color:var(--accent)}
.hero p{font-size:18px;color:var(--muted);margin:0 0 26px;max-width:32em}
.hero .ctas{display:flex;gap:10px;flex-wrap:wrap}
.hero .fine{margin-top:14px;font-size:13px;color:var(--dim)}
.mock{background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadowLg);padding:20px;display:grid;gap:14px}
.mock .row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mock .k{border:1px solid var(--line);border-radius:14px;padding:12px}
.mock .k b{display:block;font-size:20px;letter-spacing:-.02em}
.mock .k span{font-size:12px;color:var(--muted)}
.mock .bars{display:flex;align-items:flex-end;gap:8px;height:120px;padding:10px 4px 0;border-top:1px solid var(--line)}
.mock .bars i{flex:1;background:var(--accent);opacity:.28;border-radius:6px 6px 0 0}
.mock .bars i:last-child{opacity:1}
.mock .ai{display:flex;gap:10px;align-items:flex-start;background:var(--accentSoft);border-radius:14px;padding:12px;font-size:13.5px}
.mock .ai svg{color:var(--accent);margin-top:2px}
.sec{padding-block:56px;border-top:1px solid var(--line)}
.sec h2{font-size:clamp(24px,3vw,34px);letter-spacing:-.025em;margin:0 0 8px;text-wrap:balance}
.sec .lead{color:var(--muted);margin:0 0 28px;max-width:40em}
.feats{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.feat{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px;display:grid;gap:10px;box-shadow:var(--shadow)}
.feat .ic{width:42px;height:42px;border-radius:12px;background:var(--accentSoft);color:var(--accent);display:grid;place-items:center}
.feat h3{margin:0;font-size:17px}
.feat p{margin:0;color:var(--muted);font-size:14px}
.qlist{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.q{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-weight:600;font-size:14px;display:flex;gap:10px;align-items:center}
.q svg{color:var(--accent)}
.footer{padding-block:32px;border-top:1px solid var(--line);color:var(--dim);font-size:13px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

.authwrap{min-height:calc(100vh - 68px);display:grid;place-items:center;padding-block:24px 48px}
.authcard{width:min(420px,100%);background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:var(--shadowLg);display:grid;gap:16px}
.authcard h1{margin:0;font-size:26px;letter-spacing:-.02em}
.authcard p{margin:0;color:var(--muted)}
.divider{display:flex;align-items:center;gap:10px;color:var(--dim);font-size:13px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}

/* app shell */
.shell{display:grid;grid-template-columns:252px 1fr;min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);background:var(--surface);padding:18px 14px;display:flex;flex-direction:column;gap:6px;overflow-y:auto}
.sidebar .brand{padding:4px 8px 16px}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;color:var(--muted);font-weight:600;font-size:14.5px}
.nav a:hover{background:var(--surface2);color:var(--ink)}
.nav a.on{background:var(--accentSoft);color:var(--accent)}
.nav{display:grid;gap:2px}
.navlabel{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);padding:14px 12px 4px}
.planbox{margin-top:auto;border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:10px;background:var(--surface2)}
.planbox .top{display:flex;justify-content:space-between;align-items:center}
.meter{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:99px}
.userrow{display:flex;align-items:center;gap:10px;padding:10px 6px 0}
.ava{width:34px;height:34px;border-radius:50%;background:var(--accentSoft);color:var(--accent);display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}
.userrow .nm{min-width:0;flex:1}
.userrow b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.userrow span{display:block;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.main{min-width:0;padding:24px 32px 48px}
.topbar{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap;margin-bottom:22px}
.topbar h1{margin:0;font-size:26px;letter-spacing:-.025em;font-weight:800}
.topbar p{margin:2px 0 0;color:var(--muted);font-size:14px}
.topbar .acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mtop{display:none}
.bnav{display:none}
@media (max-width:900px){
  .shell{display:block}
  .sidebar{display:none}
  .main{padding:12px 16px calc(96px + env(safe-area-inset-bottom,0px))}
  .mtop{display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);margin-inline:-16px;padding:10px 16px}
  .topbar h1{font-size:22px}
  .bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
  .bnav a,.bnav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);padding:6px 2px;border-radius:12px;background:none;border:0;cursor:pointer}
  .bnav a.on,.bnav button.on{color:var(--accent)}
  .bnav .plus{align-self:center;justify-self:center;width:48px;height:48px;border-radius:16px;background:var(--accent);color:var(--accentInk);display:grid;place-items:center;box-shadow:0 8px 20px color-mix(in srgb,var(--accent) 35%,transparent)}
  .bnav .plus svg{width:22px;height:22px}
}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:20px;min-width:0}
.card h2{margin:0;font-size:16px;font-weight:700;letter-spacing:-.01em}
.card .ch{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.card .sub{font-size:13px;color:var(--muted);margin-top:2px}
.kpis{display:grid;gap:14px;grid-template-columns:repeat(3,1fr);margin-bottom:16px}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,1fr)}}
@media (max-width:420px){.kpis{gap:10px}}
.kpis.mini{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:12px}
.kpis.mini .kpi{box-shadow:none;background:var(--surface2);padding:14px}
.kpis.mini .v{font-size:21px;white-space:normal}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:18px;display:grid;gap:6px;min-width:0}
.kpi .l{font-size:13px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:8px}
.kpi .l svg{width:16px;height:16px;color:var(--accent)}
.kpi .v{font-size:clamp(20px,2.4vw,28px);font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.cols{display:grid;gap:16px;grid-template-columns:1.6fr 1fr;margin-bottom:16px}
.cols.even{grid-template-columns:1fr 1fr}
@media (max-width:1100px){.cols,.cols.even{grid-template-columns:1fr}}
.stack{display:grid;gap:16px}

/* charts */
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;overflow:visible}
.chart text{font-family:var(--font);font-size:11.5px;fill:var(--muted);font-variant-numeric:tabular-nums}
.tip{position:fixed;z-index:90;pointer-events:none;background:var(--ink);color:var(--surface);padding:8px 10px;border-radius:10px;font-size:12.5px;line-height:1.35;box-shadow:var(--shadowLg);transform:translate(-50%,calc(-100% - 10px));white-space:nowrap}
.tip b{font-size:14px}
.hbars{display:grid;gap:12px}
.hb{display:grid;grid-template-columns:minmax(96px,150px) 1fr auto;gap:12px;align-items:center;font-size:14px}
.hb .n{display:flex;gap:8px;align-items:center;min-width:0}
.hb .n span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .n svg{width:16px;height:16px;color:var(--muted)}
.hb .t{height:10px;border-radius:99px;background:var(--grid);overflow:hidden}
.hb .t i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.hb .v{font-weight:700;font-variant-numeric:tabular-nums;text-align:right;min-width:72px}
.hb .v small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.dtable{width:100%;border-collapse:collapse;font-size:14px}
.dtable th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line)}
.dtable td{padding:10px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.dtable td.r,.dtable th.r{text-align:right}
.scrollx{overflow-x:auto}

/* lists */
.rlist{display:grid}
.ritem{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.ritem:last-child{border-bottom:0}
.cic{width:40px;height:40px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);display:grid;place-items:center;color:var(--accent)}
.ritem b{display:block;font-size:14.5px}
.ritem span{font-size:12.5px;color:var(--muted)}
.ritem .amt{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}

/* expenses table */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:14px}
.filters .field{min-width:150px;flex:1}
.filters .field.wide{flex:2;min-width:200px}
.xt{width:100%;border-collapse:separate;border-spacing:0}
.xt th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none;white-space:nowrap}
.xt td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:14.5px}
.xt tr:hover td{background:var(--surface2)}
.xt .amt{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.xt .acts{text-align:right;white-space:nowrap}
.xt .cat{display:flex;gap:10px;align-items:center}
.xt .cat .cic{width:34px;height:34px;border-radius:10px}
.xt .note{color:var(--muted);font-size:13px;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:760px){
  .xt thead{display:none}
  .xt,.xt tbody,.xt tr,.xt td{display:block;width:100%}
  .xt tr{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:12px 0;border-bottom:1px solid var(--line)}
  .xt td{border:0;padding:0}
  .xt tr:hover td{background:none}
  .xt td.d{grid-column:1;order:2;font-size:12.5px;color:var(--muted)}
  .xt td.c{grid-column:1;order:1}
  .xt td.amt{grid-column:2;grid-row:1;order:0}
  .xt td.nt{grid-column:1/-1;order:3}
  .xt td.car{display:none}
  .xt td.acts{grid-column:2;grid-row:2;order:4}
}
.sumbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px;background:var(--surface2);border:1px solid var(--line);border-radius:14px;margin-bottom:6px;font-size:14px}
.sumbar b{font-variant-numeric:tabular-nums}

/* cars */
.cars{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.carcard{display:grid;gap:14px;position:relative}
.carcard.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),var(--shadow)}
.carcard .ttl{display:flex;gap:12px;align-items:center}
.carcard .ttl .cic{width:48px;height:48px;border-radius:14px}
.carcard h3{margin:0;font-size:18px;letter-spacing:-.01em}
.specs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.spec{background:var(--surface2);border-radius:12px;padding:10px 12px}
.spec span{display:block;font-size:12px;color:var(--muted)}
.spec b{font-variant-numeric:tabular-nums}
.carcard .acts{display:flex;gap:8px;flex-wrap:wrap}

/* calculator */
.calc{display:grid;gap:16px;grid-template-columns:1fr 1fr}
@media (max-width:1000px){.calc{grid-template-columns:1fr}}
.res{display:grid;gap:12px;grid-template-columns:repeat(3,1fr)}
@media (max-width:560px){.res{grid-template-columns:1fr}}
.res .kpi{box-shadow:none;background:var(--surface2)}
.res .kpi.hl{background:var(--accent);border-color:var(--accent);color:var(--accentInk)}
.res .kpi.hl .l,.res .kpi.hl .s{color:color-mix(in srgb,var(--accentInk) 80%,transparent)}
.res .kpi.hl .l svg{color:var(--accentInk)}
.slider{display:grid;gap:6px}
.slider .top{display:flex;justify-content:space-between;font-size:14px;font-weight:600}
.slider .top b{font-variant-numeric:tabular-nums}
.slider .sc{display:flex;justify-content:space-between;font-size:12px;color:var(--dim)}
.delta{font-weight:700;font-variant-numeric:tabular-nums}
.delta.up{color:var(--bad)} .delta.down{color:var(--good)}

/* ai */
.ai{display:grid;grid-template-columns:1fr 300px;gap:16px;align-items:start}
@media (max-width:1100px){.ai{grid-template-columns:1fr}}
.chatbox{display:flex;flex-direction:column;min-height:560px;padding:0;overflow:hidden}
.msgs{flex:1;padding:20px;display:flex;flex-direction:column;gap:14px;overflow-y:auto;max-height:62vh}
.msg{max-width:88%;padding:12px 14px;border-radius:16px;font-size:14.5px;line-height:1.55;white-space:pre-line}
.msg.u{align-self:flex-end;background:var(--accent);color:var(--accentInk);border-bottom-right-radius:6px}
.msg.a{align-self:flex-start;background:var(--surface2);border:1px solid var(--line);border-bottom-left-radius:6px}
.msg .meta{display:flex;gap:6px;align-items:center;margin-top:8px;font-size:12px;color:var(--muted);white-space:normal}
.msg.a b{font-weight:700}
.typing{display:flex;gap:4px;padding:14px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:bl 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,100%{opacity:.25}50%{opacity:1}}
.composer{border-top:1px solid var(--line);padding:14px;display:grid;gap:10px;background:var(--surface)}
.composer .row{display:flex;gap:8px}
.composer textarea{min-height:46px;max-height:140px}
.qchips{display:flex;gap:8px;flex-wrap:wrap}
.qchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink);text-align:left}
.qchip:hover{border-color:var(--accent);color:var(--accent)}
.paywall{border:1px solid var(--accent);background:linear-gradient(180deg,var(--accentSoft),var(--surface));border-radius:18px;padding:18px;display:grid;gap:10px}
.paywall h3{margin:0;font-size:17px;display:flex;gap:8px;align-items:center}
.paywall h3 svg{color:var(--accent)}
.paywall p{margin:0;color:var(--muted);font-size:14px}
.locked{position:relative;overflow:hidden}
.locked .blur{filter:blur(6px);opacity:.55;pointer-events:none;user-select:none}
.locked .lockov{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px}
.locked .lockov>div{display:grid;gap:10px;justify-items:center;max-width:320px}
.locked .lockov svg{color:var(--accent);width:26px;height:26px}

/* pricing */
.plans{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));max-width:860px}
.plan{display:grid;gap:16px;align-content:start;position:relative}
.plan.pro{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),var(--shadowLg)}
.plan .pr{font-size:38px;font-weight:800;letter-spacing:-.03em}
.plan .pr small{font-size:15px;color:var(--muted);font-weight:500}
.plan ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.plan li{display:flex;gap:10px;font-size:14.5px}
.plan li svg{color:var(--good);width:17px;height:17px;margin-top:2px}
.plan li.no{color:var(--dim)} .plan li.no svg{color:var(--dim)}

/* settings */
.set{display:grid;gap:16px;max-width:760px}
.setrow{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap;padding:14px 0;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:0}
.setrow .t b{display:block}
.setrow .t span{font-size:13px;color:var(--muted)}

/* empty / modal / toast */
.empty{display:grid;justify-items:center;text-align:center;gap:12px;padding:48px 20px}
.empty .ic{width:60px;height:60px;border-radius:18px;background:var(--accentSoft);color:var(--accent);display:grid;place-items:center}
.empty .ic svg{width:28px;height:28px}
.empty h3{margin:0;font-size:19px}
.empty p{margin:0;color:var(--muted);max-width:30em}
.empty .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.ov{position:fixed;inset:0;z-index:70;background:rgba(8,12,24,.5);backdrop-filter:blur(4px);display:grid;place-items:center;padding:16px;animation:fi .15s ease}
@keyframes fi{from{opacity:0}to{opacity:1}}
.modal{width:min(540px,100%);max-height:calc(100vh - 32px);overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadowLg);padding:24px;display:grid;gap:16px;animation:pu .18s ease}
@keyframes pu{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.modal h3{margin:0;font-size:20px;letter-spacing:-.01em;display:flex;justify-content:space-between;align-items:center;gap:10px}
.modal p{margin:0;color:var(--muted)}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
@media (max-width:560px){.ov{place-items:end center;padding:0}.modal{border-radius:24px 24px 0 0;max-height:92vh;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}}
.toasts{position:fixed;z-index:95;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;max-width:min(380px,calc(100vw - 32px))}
@media (max-width:900px){.toasts{bottom:calc(84px + env(safe-area-inset-bottom,0px))}}
.toast{background:var(--ink);color:var(--surface);border-radius:14px;padding:12px 14px;font-size:14px;display:flex;gap:10px;align-items:flex-start;box-shadow:var(--shadowLg);animation:pu .2s ease}
.toast svg{flex:none;margin-top:1px}
.toast.ok svg{color:#3CCB85} .toast.err svg{color:#FF6B72}
.note{font-size:13px;color:var(--muted)}
.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--warnSoft);color:var(--ink);font-size:13.5px}
.banner svg{color:var(--warn);margin-top:1px}
.banner.info{background:var(--accentSoft)} .banner.info svg{color:var(--accent)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>

<div id="app"></div>

/* ---------------- server/auth (локальная реализация; API-роуты для Auth.js — в комментариях) ----------------
   Продакшн: Auth.js (Credentials + email) → Prisma (User, Car, Expense, Subscription, AiUsage) → PostgreSQL.
   Здесь: пользователи и их данные хранятся в браузере, каждый видит только свой раздел cc:data:<userId>. */
async function hashPass(pw,salt){
  try{ const buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(salt+":"+pw)); return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join(""); }
  catch(e){ let h=5381; const s=salt+":"+pw; for(let i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))|0; return "f"+(h>>>0).toString(16); }
}
const Auth={
  users(){ return store.get("cc:users",[]); },
  current(){ const id=store.get("cc:session",null); return id?this.users().find(u=>u.id===id)||null:null; },
  async register(inp){
    const r=Schemas.register.safeParse(inp); if(!r.success) return {errors:fieldErrors(r.error)};
    const users=this.users(); if(users.some(u=>u.email===r.data.email)) return {errors:{email:"Пользователь с таким email уже есть"}};
    const salt=uid(); const u={id:uid(),name:r.data.name,email:r.data.email,salt,hash:await hashPass(r.data.password,salt),createdAt:Date.now()};
    users.push(u); store.set("cc:users",users); store.set("cc:session",u.id); Data.init(u.id); return {user:u};
  },
  async login(inp){
    const r=Schemas.login.safeParse(inp); if(!r.success) return {errors:fieldErrors(r.error)};
    const u=this.users().find(x=>x.email===r.data.email);
    if(!u||u.hash!==await hashPass(r.data.password,u.salt)) return {errors:{password:"Неверный email или пароль"}};
    store.set("cc:session",u.id); return {user:u};
  },
  logout(){ store.del("cc:session"); },
  update(id,patch){ const users=this.users(); const i=users.findIndex(u=>u.id===id); if(i>=0){ users[i]={...users[i],...patch}; store.set("cc:users",users); } },
  remove(id){ store.set("cc:users",this.users().filter(u=>u.id!==id)); store.del("cc:data:"+id); store.del("cc:session"); }
};

/* ---------------- domain/calc — все бизнес-расчёты ---------------- */
const Calc={
  forCar(list,carId){ return carId==="all"?list:list.filter(e=>e.carId===carId); },
  sum(list){ return round2(list.reduce((a,e)=>a+e.amount,0)); },
  inMonth(list,k){ return list.filter(e=>e.date.startsWith(k)); },
  inYear(list,y){ return list.filter(e=>e.date.startsWith(String(y))); },
  monthSeries(list,n,end=mkey(new Date())){ const out=[]; for(let i=n-1;i>=0;i--){ const k=addMonths(end,-i); out.push({key:k,label:mLabel(k,true),total:this.sum(this.inMonth(list,k))}); } return out; },
  firstMonth(list){ return list.length?list.reduce((m,e)=>e.date<m?e.date:m,list[0].date).slice(0,7):null; },
  /* средние расходы в месяц: полные месяцы за последние 12 (текущий неполный месяц не учитываем, если есть история) */
  avgMonthly(list){
    const first=this.firstMonth(list); if(!first) return 0; const cur=mkey(new Date());
    let months=[]; for(let i=1;i<=12;i++){ const k=addMonths(cur,-i); if(k>=first) months.push(k); }
    if(!months.length) return this.sum(this.inMonth(list,cur));
    return round2(months.reduce((a,k)=>a+this.sum(this.inMonth(list,k)),0)/months.length);
  },
  byCategory(list){ const t={}; list.forEach(e=>t[e.category]=(t[e.category]||0)+e.amount); const total=Object.values(t).reduce((a,b)=>a+b,0);
    return Object.entries(t).map(([cat,v])=>({cat,total:round2(v),share:total?v/total:0})).sort((a,b)=>b.total-a.total); },
  mom(list,k=mkey(new Date())){ const cur=this.sum(this.inMonth(list,k)), prev=this.sum(this.inMonth(list,addMonths(k,-1))); return {cur,prev,diff:round2(cur-prev),pct:prev?(cur-prev)/prev:null}; },
  /* пробег по месяцу: из показаний одометра в расходах, иначе — средний пробег авто */
  kmInMonth(list,car,k){
    const pts=list.filter(e=>e.carId===car.id&&e.odometer).map(e=>({d:e.date,o:e.odometer})).sort((a,b)=>a.d<b.d?-1:1);
    const before=pts.filter(p=>p.d<k+"-01").pop(), inm=pts.filter(p=>p.d.startsWith(k));
    if(before&&inm.length){ const km=inm[inm.length-1].o-before.o; if(km>0) return km; }
    return car.monthlyKm;
  },
  costPerKm(total,km){ return km>0?total/km:0; },
  cpkSeries(list,cars,n){ return this.monthSeries(list,n).map(m=>{ const km=cars.reduce((a,c)=>a+this.kmInMonth(list,c,m.key),0); return {...m,km,cpk:this.costPerKm(m.total,km)}; }); },
  fuel(list,car){
    const f=list.filter(e=>e.category==="fuel"&&(!car||e.carId===car.id));
    const withL=f.filter(e=>e.liters); const liters=withL.reduce((a,e)=>a+e.liters,0), spent=withL.reduce((a,e)=>a+e.amount,0);
    const price=liters?spent/liters:null;
    let cons=null; if(car){ const pts=f.filter(e=>e.odometer&&e.liters).sort((a,b)=>a.odometer-b.odometer);
      if(pts.length>=2){ const km=pts[pts.length-1].odometer-pts[0].odometer; const l=pts.slice(1).reduce((a,e)=>a+e.liters,0); if(km>0) cons=l/km*100; } }
    return {total:this.sum(f),liters,price,cons};
  },
  /* прогноз на год: средняя за 6 полных месяцев × 12, диапазон ± стандартное отклонение */
  forecast(list){
    const cur=mkey(new Date()); const ks=[1,2,3,4,5,6].map(i=>addMonths(cur,-i)).filter(k=>this.inMonth(list,k).length);
    if(ks.length<3) return null; const vals=ks.map(k=>this.sum(this.inMonth(list,k))); const avg=vals.reduce((a,b)=>a+b,0)/vals.length;
    const sd=Math.sqrt(vals.reduce((a,v)=>a+(v-avg)**2,0)/vals.length);
    return {monthly:avg,year:avg*12,low:Math.max(0,(avg-sd)*12),high:(avg+sd)*12,basis:ks.length};
  },
  /* калькулятор стоимости владения. insurance и tax — в год, остальное — в месяц */
  ownership(i){
    const fuel=i.km*i.cons/100*i.price; const parts={fuel,insurance:i.insurance/12,service:i.service,parking:i.parking,tax:i.tax/12,loan:i.loan};
    const month=Object.values(parts).reduce((a,b)=>a+b,0); return {parts,month,year:month*12,perKm:i.km>0?month/i.km:0};
  },
  simulate(base,change){ const a=this.ownership(base), b=this.ownership({...base,...change}); return {base:a,next:b,dMonth:b.month-a.month,dYear:b.year-a.year,dKm:b.perKm-a.perKm}; },
  compareMonths(list,a,b){ const A=this.inMonth(list,a), B=this.inMonth(list,b);
    return CAT_KEYS.map(c=>({cat:c,a:this.sum(A.filter(e=>e.category===c)),b:this.sum(B.filter(e=>e.category===c))})).filter(r=>r.a||r.b).map(r=>({...r,diff:round2(r.b-r.a)})); },
  /* базовые значения калькулятора из реальных данных: средние по категориям за 3 полных месяца */
  calcDefaults(list,car){
    const cur=mkey(new Date()); const ks=[1,2,3].map(i=>addMonths(cur,-i)); const L=list.filter(e=>!car||e.carId===car.id);
    const avg=c=>{ const v=ks.map(k=>this.sum(this.inMonth(L,k).filter(e=>e.category===c))); return round2(v.reduce((a,b)=>a+b,0)/ks.length); };
    const yr=c=>this.sum(L.filter(e=>e.category===c&&e.date>=addMonths(cur,-11)+"-01"));
    const f=this.fuel(L,car);
    return {km:car?car.monthlyKm:1000,cons:car?car.consumption:7,price:round2(f.price||(car?car.fuelPrice:1.8)),insurance:round2(avg("insurance")*12),service:avg("service"),parking:avg("parking"),tax:yr("tax"),loan:avg("loan")};
  }
};

/* Mock-ответы: без нейросети, но строго по данным пользователя (никаких выдуманных цифр) */
const MockAI={
  answer(q,ctx){
    const s=q.toLowerCase(); const M=ctx.months;
    if(!ctx.car) return "Недостаточно данных: у вас нет автомобиля. Добавьте автомобиль и расходы, и я смогу их проанализировать.";
    if(!M.length) return `Недостаточно данных: для ${ctx.car.name} нет ни одного расхода. Добавьте расходы хотя бы за 2 месяца.`;
    const pctIn=(def)=>{ const m=s.match(/(\d{1,3})\s*%/); return m?+m[1]/100:def; };
    const full=M.filter(m=>m.month!==ctx.currentMonth);

      const last=M[M.length-1], prev=M[M.length-2];

      const diffs=[...cats].map(c=>({c,d:round2((last.byCategory[c]||0)-(prev.byCategory[c]||0))})).filter(x=>x.d!==0).sort((a,b)=>b.d-a.d);
      const delta=round2(last.total-prev.total);
      let t=`${mLabelCap(last.month)}: ${eur2(last.total)}, ${mLabel(prev.month)}: ${eur2(prev.total)}. `;
      t+= delta>0?`Расходы выросли на ${eur2(delta)} (${numf(delta/prev.total*100,1)}%).`:`Расходы не выросли: они ниже на ${eur2(-delta)}.`;
      if(last.month===ctx.currentMonth) t+=` Учтите, что ${mLabel(last.month)} ещё не закончился.`;
      const ups=diffs.filter(x=>x.d>0).slice(0,3), downs=diffs.filter(x=>x.d<0).slice(0,2);
      if(ups.length) t+=`\n\nБольше всего выросли:\n`+ups.map(x=>`• ${x.c}: +${eur2(x.d)}`).join("\n");
      if(downs.length) t+=`\n\nСнизились:\n`+downs.map(x=>`• ${x.c}: ${eur2(x.d)}`).join("\n");
      return t;
    }
    if(/больше всего|трачу|основн|структур|на что/.test(s)){
      const tot={}; let all=0; M.forEach(m=>Object.entries(m.byCategory).forEach(([c,v])=>{ tot[c]=(tot[c]||0)+v; all+=v; }));
      const top=Object.entries(tot).sort((a,b)=>b[1]-a[1]);

        top.slice(0,4).map(([c,v],i)=>`${i+1}. ${c}: ${eur2(v)} (${numf(v/all*100,0)}%)`).join("\n")+
        `\n\nВ среднем это ${eur2(ctx.avgMonthly)} в месяц.`;
    }
    if(/сниз|эконом|сократ|меньше трат|сэконом/.test(s)){
      const tot={}; M.forEach(m=>Object.entries(m.byCategory).forEach(([c,v])=>tot[c]=(tot[c]||0)+v)); const n=M.length; const perM=c=>(tot[c]||0)/n;
      const tips=[];
      if(tot["Топливо"]){ const y=perM("Топливо")*12; tips.push(`Топливо: ${eur2(perM("Топливо"))} в месяц. Снижение расхода на 5% (плавный разгон, давление в шинах) даст около ${eur2(y*0.05)} в год.`); }
      if(tot["Парковка"]){ tips.push(`Парковка: ${eur2(perM("Парковка"))} в месяц, ${eur2(perM("Парковка")*12)} в год. Проверьте абонемент или парковку дальше от центра.`); }

      if(!tips.length) return "Недостаточно данных, чтобы дать рекомендации: добавьте расходы по категориям.";
      return `Рекомендации по вашим данным за ${n} ${plural(n,"месяц","месяца","месяцев")}:\n\n`+tips.map(t=>"• "+t).join("\n")+`\n\nОценки экономии приблизительные: они считаются от ваших средних расходов.`;
    }

      const f=ctx.fuel; const avgFuel=M.reduce((a,m)=>a+(m.byCategory["Топливо"]||0),0)/M.length; if(!avgFuel) return "Недостаточно данных: нет расходов на топливо.";
      const p=pctIn(0.10); const y=avgFuel*12; const price=f.price||ctx.car.fuelPriceEurPerL;
      return `Сейчас топливо стоит вам в среднем ${eur2(avgFuel)} в месяц (${eur2(y)} в год)${price?`, средняя цена ${numf(price,2)} €/л`:""}.\n\nЕсли топливо подорожает на ${numf(p*100,0)}%${price?` (до ${numf(price*(1+p),2)} €/л)`:""}:\n• +${eur2(avgFuel*p)} в месяц\n• +${eur2(y*p)} в год\n\nДопущение: пробег и расход топлива не изменятся.`;

    }
    if(/за год|в год|годов|сколько.*стоит|прогноз/.test(s)){
      const fc=ctx.forecast; if(!fc) return "Недостаточно данных для прогноза: нужны расходы хотя бы за 3 полных месяца.";
      return `По данным за последние ${fc.basis} ${plural(fc.basis,"месяц","месяца","месяцев")} автомобиль обходится в среднем в ${eur2(fc.monthly)} в месяц.\n\nПрогноз на год: около ${eur(fc.year)} (вероятный диапазон ${eur(fc.low)} – ${eur(fc.high)}).\n\nПрогноз не учитывает разовые траты, которых ещё не было в истории: например, крупный ремонт.`;
    }

    return `Могу ответить только по вашим данным. Кратко о ${ctx.car.name}: ${mLabel(last.month)}: ${eur2(last.total)}, в среднем ${eur2(ctx.avgMonthly)} в месяц.\n\nСпросите, например:\n• Почему мои расходы выросли?\n• На что я трачу больше всего?\n• Как снизить расходы?\n• Сколько автомобиль будет стоить мне за год?\n• Что будет, если топливо подорожает на 15%?\n• Что будет, если я начну ездить 2000 км в месяц?`;
  }
};

/* charts (SVG, single-series, hover tooltips) */
function niceMax(v){ if(v<=0) return 10; const p=Math.pow(10,Math.floor(Math.log10(v))); const n=v/p; const m=n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10; return m*p; }
const tip=$("#tip");
function showTip(e,html){ tip.innerHTML=html; tip.hidden=false; tip.style.left=e.clientX+"px"; tip.style.top=e.clientY+"px"; }
function hideTip(){ tip.hidden=true; }
function barChart(el,data,{h=240,fmt=v=>eur(v),hl=null,forecastFrom=null}={}){
  const W=Math.max(280,el.clientWidth||600), H=h, L=48, R=8, T=12, B=26; const iw=W-L-R, ih=H-T-B;
  const max=niceMax(Math.max(...data.map(d=>d.value),1)); const n=data.length; const step=iw/n; const bw=Math.min(40,step*.62);
  const ticks=[0,.25,.5,.75,1].map(t=>t*max);
  let s=`<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="Столбчатая диаграмма">`;
  ticks.forEach(t=>{ const y=T+ih-t/max*ih; s+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--grid)" stroke-width="1"/><text x="${L-8}" y="${y+4}" text-anchor="end">${t>=1000?numf(t/1000,t%1000?1:0)+"k":numf(t)}</text>`; });
  data.forEach((d,i)=>{ const x=L+i*step+(step-bw)/2; const bh=Math.max(d.value>0?2:0,d.value/max*ih); const y=T+ih-bh; const r=Math.min(4,bw/2,bh);
    const isF=d.forecast; const isHl=hl===i;
    const fill=isF?"none":isHl?"var(--accent)":"color-mix(in srgb,var(--accent) 55%,var(--surface))";
    s+=bh>0?`<path d="M${x},${T+ih} V${y+r} Q${x},${y} ${x+r},${y} H${x+bw-r} Q${x+bw},${y} ${x+bw},${y+r} V${T+ih} Z" fill="${fill}" ${isF?'stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="4 3"':""}/>`:"";
    s+=`<text x="${x+bw/2}" y="${H-8}" text-anchor="middle" ${isHl?'style="fill:var(--ink);font-weight:700"':""}>${esc(d.label)}</text>`;
    s+=`<rect x="${L+i*step}" y="${T}" width="${step}" height="${ih+B}" fill="transparent" data-i="${i}" style="cursor:default"/>`; });
  s+=`<line x1="${L}" x2="${W-R}" y1="${T+ih}" y2="${T+ih}" stroke="var(--line)"/></svg>`;
  el.innerHTML=s; el.classList.add("chart");
  $$("rect[data-i]",el).forEach(r=>{ r.addEventListener("mousemove",e=>{ const d=data[+r.dataset.i]; showTip(e,`${esc(d.tip||d.label)}<br><b class="num">${fmt(d.value)}</b>${d.forecast?"<br>прогноз":""}`); }); r.addEventListener("mouseleave",hideTip); });
}
function lineChart(el,data,{h=220,fmt=v=>eur2(v)}={}){
  const W=Math.max(280,el.clientWidth||600), H=h, L=48, R=12, T=14, B=26; const iw=W-L-R, ih=H-T-B;
  const vals=data.map(d=>d.value); const max=niceMax(Math.max(...vals,0.01)); const n=data.length; const x=i=>L+(n===1?iw/2:i*iw/(n-1)); const y=v=>T+ih-v/max*ih;
  let s=`<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="Линейный график">`;
  [0,.25,.5,.75,1].forEach(t=>{ const yy=y(t*max); s+=`<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="var(--grid)"/><text x="${L-8}" y="${yy+4}" text-anchor="end">${numf(t*max,2)}</text>`; });
  const pts=data.map((d,i)=>`${x(i)},${y(d.value)}`).join(" ");
  s+=`<polygon points="${x(0)},${T+ih} ${pts} ${x(n-1)},${T+ih}" fill="var(--accent)" opacity=".08"/>`;
  s+=`<polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  data.forEach((d,i)=>{ s+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle">${esc(d.label)}</text>`; });
  const li=n-1; s+=`<circle cx="${x(li)}" cy="${y(data[li].value)}" r="4.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>`;
  s+=`<line id="xh" x1="0" x2="0" y1="${T}" y2="${T+ih}" stroke="var(--dim)" stroke-dasharray="3 3" visibility="hidden"/><circle id="xd" r="4.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2" visibility="hidden"/>`;
  s+=`<rect x="${L}" y="${T}" width="${iw}" height="${ih}" fill="transparent" id="hit"/></svg>`;
  el.innerHTML=s; el.classList.add("chart");
  const svg=$("svg",el), hit=$("#hit",el), xh=$("#xh",el), xd=$("#xd",el);
  hit.addEventListener("mousemove",e=>{ const r=svg.getBoundingClientRect(); const px=(e.clientX-r.left)*W/r.width; const i=clamp(Math.round((px-L)/(iw/Math.max(1,n-1))),0,n-1); const d=data[i];
    xh.setAttribute("x1",x(i)); xh.setAttribute("x2",x(i)); xh.setAttribute("visibility","visible"); xd.setAttribute("cx",x(i)); xd.setAttribute("cy",y(d.value)); xd.setAttribute("visibility","visible");
    showTip(e,`${esc(d.tip||d.label)}<br><b class="num">${fmt(d.value)}</b>${d.sub?"<br>"+esc(d.sub):""}`); });
  hit.addEventListener("mouseleave",()=>{ hideTip(); xh.setAttribute("visibility","hidden"); xd.setAttribute("visibility","hidden"); });
}

const After={
  landing(){ $("#demoBtn").onclick=demoLogin; },
  login(){ $("#demoBtn").onclick=demoLogin; $("#loginF").addEventListener("submit",async e=>{ e.preventDefault(); const r=await Auth.login(formData(e.target)); if(r.errors){ showErrors(e.target,r.errors); return; } toast("С возвращением, "+r.user.name); location.hash="dashboard"; }); },
  register(){ $("#regF").addEventListener("submit",async e=>{ e.preventDefault(); const r=await Auth.register(formData(e.target)); if(r.errors){ showErrors(e.target,r.errors); return; } toast("Аккаунт создан"); location.hash="dashboard"; }); },
  dashboard(){
    const d=Data.get(); if(!d.cars.length) return; const sel=UI.dashCar==="all"?"all":(d.activeCar||d.cars[0].id); const hist=Plan.historyFrom(d);
    const list=Calc.forCar(d.expenses,sel).filter(e=>e.date>=hist+"-01"); const n=Plan.get(d).historyMonths===Infinity?12:6;
    const ser=Calc.monthSeries(list,n); const el=$("#mchart");
    if(UI.chartView==="table") el.innerHTML=monthTable([...ser].reverse()); else barChart(el,ser.map(s=>({label:s.label,value:s.total,tip:mLabelCap(s.key)+(s.key===mkey(new Date())?" (идёт)":"")})),{hl:ser.length-1});
    $$("[data-view]").forEach(b=>b.onclick=()=>{ UI.chartView=b.dataset.view; render(); });
    $$("[data-cp]").forEach(b=>b.onclick=()=>{ UI.catPeriod=b.dataset.cp; render(); });
    const ds=$("#dashCar"); if(ds) ds.onchange=()=>{ UI.dashCar=ds.value; render(); };
  },
  cars(){ $$("[data-carAct]").forEach(b=>b.onclick=async()=>{ const d=Data.get(); const c=d.cars.find(x=>x.id===b.dataset.id); const a=b.dataset.caract||b.getAttribute("data-carAct");
    if(a==="edit") carForm(c);
    if(a==="activate"){ Data.mutate(d=>d.activeCar=c.id); toast(`${c.brand} ${c.model} теперь активный`); render(); }
    if(a==="del"){ const n=d.expenses.filter(e=>e.carId===c.id).length; if(await confirmBox(`Удалить ${c.brand} ${c.model}?`,`Вместе с автомобилем удалятся ${n} ${plural(n,"расход","расхода","расходов")}. Это нельзя отменить.`)){ Data.mutate(d=>{ d.cars=d.cars.filter(x=>x.id!==c.id); d.expenses=d.expenses.filter(e=>e.carId!==c.id); if(d.activeCar===c.id) d.activeCar=d.cars[0]?d.cars[0].id:null; }); toast("Автомобиль удалён"); render(); } } }); },
  expenses(){
    const fx=UI.fx; const set=(k,v)=>{ fx[k]=v; render(); };
    const q=$("#fq"); if(q){ let t; q.addEventListener("input",()=>{ clearTimeout(t); t=setTimeout(()=>{ fx.q=q.value; const pos=q.selectionStart; render(); const n=$("#fq"); n.focus(); n.setSelectionRange(pos,pos); },250); }); }
    [["fcat","cat"],["fcar","car"],["fper","period"],["ffrom","from"],["fto","to"]].forEach(([id,k])=>{ const el=$("#"+id); if(el) el.onchange=()=>set(k,el.value); });
    const r=$("#freset"); if(r) r.onclick=()=>{ UI.fx={q:"",cat:"all",car:"all",period:"6m",from:"",to:"",sort:"date"}; render(); };
    $$("[data-sort]").forEach(th=>th.onclick=()=>set("sort",th.dataset.sort));
    $$("[data-ex]").forEach(b=>b.onclick=()=>{ const e=Data.get().expenses.find(x=>x.id===b.dataset.id); if(b.dataset.ex==="edit") expenseForm(e); else deleteExpense(e.id); });
  },
  analytics(){
    const d=Data.get(); if(!d.cars.length) return; const p=Plan.get(d); const car=d.cars.find(c=>c.id===d.activeCar)||d.cars[0]; const hist=Plan.historyFrom(d);
    const list=d.expenses.filter(e=>e.carId===car.id&&e.date>=hist+"-01"); const n=p.advanced?UI.anMonths:6; const cur=mkey(new Date());
    const ser=Calc.monthSeries(list,n); barChart($("#a1"),ser.map(s=>({label:s.label,value:s.total,tip:mLabelCap(s.key)})),{hl:ser.length-1});
    const cpk=Calc.cpkSeries(list,[car],n); lineChart($("#a2"),cpk.map(s=>({label:s.label,value:s.cpk,tip:mLabelCap(s.key),sub:`${eur2(s.total)} / ${numf(s.km)} км`})),{fmt:v=>numf(v,3)+" € за км"});
    const fs=Calc.monthSeries(list.filter(e=>e.category==="fuel"),n); barChart($("#a3"),fs.map(s=>({label:s.label,value:s.total,tip:"Топливо, "+mLabel(s.key)})),{h:180,hl:fs.length-1});
    const fc=Calc.forecast(list); const fel=$("#fchart");
    if(fc&&fel){ const past=Calc.monthSeries(list,6).map(s=>({label:s.label,value:s.total,tip:mLabelCap(s.key)})); const fut=[1,2,3,4,5,6].map(i=>{ const k=addMonths(cur,i); return {label:mLabel(k,true),value:fc.monthly,forecast:true,tip:mLabelCap(k)}; });
      barChart(fel,[...past,...fut],{h:200,hl:5}); }
    $$("[data-an]").forEach(b=>b.onclick=()=>{ const v=+b.dataset.an; if(v===12&&!p.advanced){ paywall("Аналитика за 12 месяцев доступна в AI Pro."); return; } UI.anMonths=v; render(); });
    $("#cmpA").onchange=e=>{ UI.cmpA=e.target.value; render(); }; $("#cmpB").onchange=e=>{ UI.cmpB=e.target.value; render(); };
  },
  calculator(){
    const F=$("#calcF"); const upd=()=>{ const r=Schemas.calc.safeParse(formData(F)); if(!r.success){ showErrors(F,fieldErrors(r.error)); return; } showErrors(F,{}); UI.calc=r.data; drawCalc(); drawSim(); };
    F.addEventListener("input",upd); drawCalc(); drawSim();
    $$("[data-sim]").forEach(s=>s.addEventListener("input",()=>{ UI.sim[s.dataset.sim]=+s.value; const fm={price:v=>numf(v,2)+" €/л",km:v=>numf(v)+" км",cons:v=>numf(v,1)+" л/100 км"}[s.dataset.sim]; $("#sv_"+s.dataset.sim).textContent=fm(+s.value); drawSim(); }));
    $("#simReset").onclick=()=>{ UI.sim={price:UI.calc.price,km:UI.calc.km,cons:UI.calc.cons}; render(); };
    const fm=$("#fillMine"); if(fm) fm.onclick=()=>{ const d=Data.get(); const car=d.cars.find(c=>c.id===d.activeCar)||d.cars[0]; UI.calc=Calc.calcDefaults(d.expenses,car); UI.sim=null; render(); toast("Подставлены средние значения за 3 последних месяца"); };
  },
  ai(){
    const d=Data.get(); const box=$("#msgs"); box.scrollTop=box.scrollHeight;
    const cc=$("#clearChat"); if(cc) cc.onclick=async()=>{ if(await confirmBox("Очистить историю чата?","Сообщения удалятся. Лимит запросов не изменится.","Очистить")){ Data.mutate(d=>d.chat=[]); render(); } };
    const F=$("#aiF"); if(!F) return; const inp=$("#aiIn");
    inp.addEventListener("keydown",e=>{ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); F.requestSubmit(); } });
    $$("[data-q]").forEach(b=>b.onclick=()=>{ inp.value=b.dataset.q; F.requestSubmit(); });
    F.addEventListener("submit",async e=>{ e.preventDefault(); const q=inp.value.trim(); if(!q||UI.busy) return;
      if(Plan.aiLeft()<=0){ paywall("Вы использовали все бесплатные запросы к ИИ в этом месяце. В AI Pro запросы не ограничены."); return; }
      UI.busy=true; Data.mutate(d=>{ d.chat.push({role:"user",text:q}); d.aiUsage[mkey(new Date())]=(d.aiUsage[mkey(new Date())]||0)+1; });
      render(); const b=$("#msgs"); b.insertAdjacentHTML("beforeend",`<div class="msg a typing" id="typing"><i></i><i></i><i></i></div>`); b.scrollTop=b.scrollHeight;
      const [res]=await Promise.all([AIService.ask(q),new Promise(r=>setTimeout(r,650))]);
      Data.mutate(d=>d.chat.push({role:"assistant",text:res.text,source:res.source,warn:res.warn})); UI.busy=false; render();
      if(Plan.aiLeft()===0&&Plan.get().id==="free") toast("Это был последний бесплатный запрос в этом месяце","info"); });
  },
  pricing(){ const tf=$("#toFree"); if(tf) tf.onclick=async()=>{ if(await confirmBox("Перейти на бесплатный тариф?","Прогнозы, безлимитный ИИ и история старше 6 месяцев станут недоступны. Данные не удалятся.","Перейти")){ await Billing.cancel(); toast("Тариф изменён на бесплатный","info"); render(); } }; },
  settings(){
    $("#profF").addEventListener("submit",e=>{ e.preventDefault(); const r=Schemas.register.pick({name:true}).safeParse(formData(e.target)); if(!r.success){ showErrors(e.target,fieldErrors(r.error)); return; } Auth.update(ME.id,{name:r.data.name}); toast("Имя сохранено"); render(); });
    $$("[data-theme-set]").forEach(b=>b.onclick=()=>{ Data.mutate(d=>d.theme=b.dataset.themeSet); render(); });
    const cs=$("#cancelSub"); if(cs) cs.onclick=async()=>{ if(await confirmBox("Отменить AI Pro?","Вы перейдёте на бесплатный тариф. Данные сохранятся.","Отменить подписку")){ await Billing.cancel(); toast("Подписка отменена","info"); render(); } };
    const F=$("#aiSetF"); F.provider.onchange=()=>{ F.model.placeholder=F.provider.value==="anthropic"?"claude-haiku-4-5-20251001":"gpt-4o-mini"; };
    F.addEventListener("submit",e=>{ e.preventDefault(); const r=Schemas.aiSettings.safeParse(formData(F)); if(!r.success){ showErrors(F,fieldErrors(r.error)); return; } Data.mutate(d=>d.ai=r.data); toast(r.data.provider==="mock"?"Включён демо-режим ИИ":"Настройки ИИ сохранены"); render(); });
    $("#aiTest").onclick=async()=>{ const r=Schemas.aiSettings.safeParse(formData(F)); if(!r.success){ showErrors(F,fieldErrors(r.error)); return; } if(r.data.provider==="mock"){ toast("Демо-режим работает без подключения","info"); return; }
      const b=$("#aiTest"); b.disabled=true; b.textContent="Проверяем…";
      try{ const t=await Providers[r.data.provider](r.data,"Отвечай одним словом по-русски.","Скажи: работает"); toast("Подключение работает: "+t.slice(0,40)); }catch(err){ toast("Не удалось подключиться: "+err.message,"err"); }
      finally{ b.disabled=false; b.textContent="Проверить подключение"; } };
    $("#wipe").onclick=async()=>{ if(await confirmBox("Удалить все автомобили и расходы?","Аккаунт и тариф останутся. Это нельзя отменить.")){ Data.mutate(d=>{ d.cars=[]; d.expenses=[]; d.activeCar=null; d.chat=[]; }); UI.calc=null; UI.sim=null; toast("Данные удалены"); render(); } };
    $("#delAcc").onclick=async()=>{ if(await confirmBox("Удалить аккаунт?","Пользователь и все его данные будут удалены без возможности восстановления.","Удалить аккаунт")){ Auth.remove(ME.id); toast("Аккаунт удалён","info"); location.hash="landing"; } };
  }
};
function drawCalc(){ const r=Calc.ownership(UI.calc); const labels={fuel:"Топливо",insurance:"Страховка",service:"Обслуживание",parking:"Парковка",tax:"Налоги",loan:"Кредит / лизинг"}; const icm={fuel:"fuel",insurance:"shield",service:"wrench",parking:"parking",tax:"receipt",loan:"bank"};
  const rows=Object.entries(r.parts).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]); const max=Math.max(...rows.map(x=>x[1]),1);
  $("#calcRes").innerHTML=`<div class="res" style="margin-bottom:18px">${kpi("calendar","В месяц",eur2(r.month),"").replace('class="kpi"','class="kpi hl"')}${kpi("chart","В год",eur(r.year),"")}${kpi("road","Стоимость 1 км",numf(r.perKm,3)+" €","")}</div>
    <div class="hbars">${rows.map(([k,v])=>`<div class="hb"><div class="n">${ic(icm[k])}<span>${labels[k]}</span></div><div class="t"><i style="width:${Math.max(2,v/max*100)}%"></i></div><div class="v">${eur2(v)}<small>${numf(v/r.month*100,0)}%</small></div></div>`).join("")||`<div class="note">Введите данные слева.</div>`}</div>
    <div class="note" style="margin-top:12px">Топливо = ${numf(UI.calc.km)} км × ${numf(UI.calc.cons,1)} л/100 км × ${numf(UI.calc.price,2)} €/л. Страховка и налоги делятся на 12.</div>`; }
function drawSim(){ const s=Calc.simulate(UI.calc,UI.sim); const dl=(v,f)=>`<span class="delta ${v>0.005?"up":v<-0.005?"down":""}">${v>0.005?"+":v<-0.005?"−":""}${f(Math.abs(v))}</span>`;
  $("#simRes").innerHTML=`<div class="res">${kpi("calendar","В месяц",eur2(s.next.month),dl(s.dMonth,eur2)+"<span>к базе</span>")}${kpi("chart","В год",eur(s.next.year),dl(s.dYear,eur)+"<span>к базе</span>")}${kpi("road","1 км",numf(s.next.perKm,3)+" €",dl(s.dKm,v=>numf(v,3)+" €"))}</div>
    <div class="note" style="margin-top:12px">База: ${eur2(s.base.month)} в месяц. Топливо сейчас ${eur2(s.base.parts.fuel)}, в симуляции ${eur2(s.next.parts.fuel)} в месяц.</div>`; }

/* ---------------- boot ---------------- */
if(!z){ document.getElementById("app").innerHTML='<div style="padding:40px;font-family:system-ui">Не удалось загрузить модуль валидации. Обновите страницу.</div>'; return; }
render();
})();
</script>

</body>
</html>
